<!DOCTYPE html>
<html>
<head>

<title>Patient Monitoring Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
font-family:Poppins;
background:#eef2f7;
margin:20px;
}

h1{
color:#d90429;
}

.container{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:20px;
margin-bottom:30px;
}

.card{
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 5px 20px rgba(0,0,0,0.1);
text-align:center;
}

.value{
font-size:30px;
margin-top:10px;
}

.safe{ color:green; }
.danger{ color:red; }

.grid{
display:grid;
grid-template-columns:2fr 1fr;
gap:20px;
}

.table{
margin-top:30px;
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
padding:10px;
border-bottom:1px solid #ddd;
text-align:center;
}

</style>

</head>

<body>

<h1>❤️ Patient Monitoring Dashboard</h1>

<!-- TOP CARDS -->
<div class="container">

<div class="card">
<h3>Heart Rate</h3>
<div id="heart" class="value">--</div>
</div>

<div class="card">
<h3>Temperature</h3>
<div id="temp" class="value">--</div>
</div>

<div class="card">
<h3>Status</h3>
<div id="status" class="value">SAFE</div>
</div>

<div class="card">
<h3>Total Alerts</h3>
<div id="alerts" class="value">0</div>
</div>

</div>

<!-- GRAPH + PIE -->
<div class="grid">

<div class="card">
<h3>Health Monitoring Graph</h3>
<canvas id="chart"></canvas>
</div>

<div class="card">
<h3>Status Ratio</h3>
<canvas id="pie"></canvas>
</div>

</div>

<!-- TABLE -->
<div class="table">

<h3>Monitoring Records</h3>

<table>
<thead>
<tr>
<th>Time</th>
<th>Heart Rate</th>
<th>Temperature</th>
<th>Status</th>
</tr>
</thead>

<tbody id="tableBody"></tbody>

</table>

</div>

<script>

const channel_id="3272990";
const read_key="2CV6JC0ZSYRG4JE1";

let alerts=0;
let safeCount=0;
let dangerCount=0;

let chartData=[];
let labels=[];

const chart = new Chart(document.getElementById("chart"),{
type:"line",
data:{
labels:labels,
datasets:[
{
label:"Heart Rate",
data:chartData,
borderWidth:2
}
]
}
});

const pie = new Chart(document.getElementById("pie"),{
type:"pie",
data:{
labels:["Safe","Danger"],
datasets:[{
data:[0,0]
}]
}
});

function fetchData(){

let url=`https://api.thingspeak.com/channels/${channel_id}/feeds.json?api_key=${read_key}&results=5`;

fetch(url)
.then(res=>res.json())
.then(data=>{

let feeds=data.feeds.reverse();

feeds.forEach(feed=>{

let heart=parseFloat(feed.field1);
let temp=parseFloat(feed.field2);

/* Convert */
temp=(temp*9/5)+32;

let time=new Date(feed.created_at).toLocaleTimeString();

let status="SAFE";

if(heart>=100 || temp>=91){
status="DANGER";
alerts++;
dangerCount++;
}else{
safeCount++;
}

/* Update cards */
document.getElementById("heart").innerText=heart+" bpm";
document.getElementById("temp").innerText=temp.toFixed(1)+" °F";
document.getElementById("status").innerText=status;
document.getElementById("alerts").innerText=alerts;

/* Color */
document.getElementById("status").className=
(status=="SAFE")?"value safe":"value danger";

/* Graph */
labels.push(time);
chartData.push(heart);

/* Table */
let row=`<tr>
<td>${time}</td>
<td>${heart}</td>
<td>${temp.toFixed(1)}</td>
<td class="${status=='SAFE'?'safe':'danger'}">${status}</td>
</tr>`;

document.getElementById("tableBody").innerHTML+=row;

});

/* Update charts */
chart.update();

pie.data.datasets[0].data=[safeCount,dangerCount];
pie.update();

});

}

/* Refresh */
setInterval(fetchData,5000);

</script>

</body>
</html>
